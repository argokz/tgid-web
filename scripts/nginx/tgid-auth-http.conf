# ===========================================================
# TGID: доступ к GeoServer только после входа — уровень http (подключается в nginx.conf рядом с
# proxy_cache_path geoserver). Пару с tgid-geoserver-auth.conf ставит H:\deploy\protect-geoserver-*.ps1.
# ===========================================================

# Ответы API «можно / нельзя» по cookie tgid_gs: 30 с на сессию, чтобы не спрашивать API на каждый тайл
proxy_cache_path C:/nginx/cache/tgid-auth levels=1 keys_zone=tgid_auth_cache:2m max_size=20m inactive=10m;

# Проверяет API Алматы; если он перезапускается — API Астаны (секрет JWT и пользователи общие)
upstream tgid_auth_api {
    server 127.0.0.1:8011;
    server 127.0.0.1:8021 backup;
    keepalive 8;
}

# Город данных в запросе к GeoServer (API /auth/check сверяет его с городами пользователя):
# у запроса к рабочей области (/geoserver/AlmatyGIS/...) — её имя, у общих сервисов (/geoserver/wms, /gwc/...) —
# весь адрес. Входит в ключ кеша проверки вместе с параметрами слоёв, чтобы «можно» для Алматы не открыло Астану.
map $request_uri $tgid_gs_scope {
    ~*^/geoserver/(?:gwc|wms|wfs|wcs|wps|ows|wmts|tms|kml|styles|schemas|pdf)(?:[/?]|$)  $request_uri;
    ~^/geoserver/(?<tgid_gs_ws>[^/?]+)/                                                 $tgid_gs_ws;
    default                                                                             $request_uri;
}
