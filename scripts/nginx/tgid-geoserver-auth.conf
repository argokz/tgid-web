# ===========================================================
# TGID: доступ к GeoServer только после входа — уровень server (include в server itwin.kz).
#
# Данные GeoServer (WMS/WMTS/WFS всех рабочих областей) отдаются, только если API ТГИД подтвердил
# сессию: cookie tgid_gs с JWT выдаёт /auth/me при входе в веб (Path=/geoserver, HttpOnly).
# В location /geoserver/ и ~* ^/geoserver/gwc/ nginx.conf стоит auth_request /_tgid_gs_auth.
# Пока вход не обязателен (AUTH_DISABLED или AUTH_REQUIRED_GET=false), API пропускает всех —
# выключение защиты открывает и GeoServer, nginx трогать не нужно.
#
# Без проверки (у GeoServer свой пароль): REST (/geoserver/rest/) и админка (/geoserver/web/).
# Значки стилей (/geoserver/www/) — отдельный location в nginx.conf, тоже без проверки.
# ===========================================================

location = /_tgid_gs_auth {
    internal;
    proxy_pass http://tgid_auth_api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;

    proxy_cache tgid_auth_cache;
    proxy_cache_key "$cookie_tgid_gs|$http_authorization";
    proxy_cache_valid 200 30s;
    proxy_cache_valid 401 5s;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
}

location ^~ /geoserver/rest/ {
    proxy_pass http://localhost:8085/geoserver/rest/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect http://localhost:8085/geoserver/ /geoserver/;
    proxy_redirect https://localhost:8085/geoserver/ /geoserver/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 600;
    client_max_body_size 100M;
}

location ^~ /geoserver/web/ {
    proxy_pass http://localhost:8085/geoserver/web/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect http://localhost:8085/geoserver/ /geoserver/;
    proxy_redirect https://localhost:8085/geoserver/ /geoserver/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 600;
    client_max_body_size 100M;
}

# Вход и выход в админку GeoServer
location ^~ /geoserver/j_spring_security {
    proxy_pass http://localhost:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect http://localhost:8085/geoserver/ /geoserver/;
    proxy_redirect https://localhost:8085/geoserver/ /geoserver/;
}
