
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Подающая труба слева -->
  <line x1="10" y1="50" x2="30" y2="50" stroke="#ff0000" stroke-width="4" />

  <!-- Отводящая труба справа -->
  <line x1="70" y1="50" x2="90" y2="50" stroke="#ff0000" stroke-width="4" />

  <!-- Корпус насоса -->
  <circle cx="50" cy="50" r="20" fill="#3399ff" stroke="#003366" stroke-width="3" />

  <!-- Белая, аккуратная стрелка вписанная в окружность -->
  <polygon points="50,43 62,50 50,57" fill="#ffffff" />
</svg>
