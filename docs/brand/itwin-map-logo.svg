  <stop offset=".49" stop-color="#2C9FE8" stop-opacity=".38"/>
  <stop offset="1" stop-color="#46DDC9" stop-opacity=".33"/>
 </linearGradient>
 <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0" stop-color="#025ED8"/><stop offset=".55" stop-color="#1469DC"/><stop offset="1" stop-color="#00AA96"/></linearGradient>
 <linearGradient id="mapText" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0" stop-color="#168CF8"/><stop offset="1" stop-color="#0877F4"/></linearGradient>
 <clipPath id="topCut"><path d="M600 68 L940 238 L600 408 L260 238 Z"/></clipPath>
