<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="logoTitle logoDescription">
<title id="logoTitle">ITwin map — GIS platform logo</title>
<desc id="logoDescription">Isometric layered geospatial map, a fine GIS grid, contour lines, transparent data layers and ITwin map wordmark. Transparent background.</desc>
<defs>
 <linearGradient id="baseMap" x1="0%" y1="75%" x2="100%" y2="10%">
  <stop offset="0" stop-color="#0757E8"/><stop offset=".28" stop-color="#0A7AF2"/>
  <stop offset=".53" stop-color="#14C7E8"/><stop offset=".78" stop-color="#15DEC5"/>
  <stop offset="1" stop-color="#03CBA6"/>
 </linearGradient>
 <linearGradient id="deepMap" x1="5%" y1="20%" x2="90%" y2="90%">
  <stop offset="0" stop-color="#0068EC"/><stop offset=".57" stop-color="#0046B8"/><stop offset="1" stop-color="#007DDF"/>
 </linearGradient>
 <linearGradient id="tealMap" x1="0%" y1="75%" x2="90%" y2="0%">
  <stop offset="0" stop-color="#078AAE"/><stop offset=".5" stop-color="#0BD2BC"/><stop offset="1" stop-color="#46F6CB"/>
 </linearGradient>
 <linearGradient id="midPanel" x1="0%" y1="30%" x2="100%" y2="70%">
