worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Nuxt ITwin Map — 127.0.0.1 вместо localhost (на части хостов IPv6 ::1 не слушается → 502)
    upstream itwin_map_nuxt {
        server 127.0.0.1:3007;
        keepalive 32;
    }

    # Proxy cache для тяжёлых/медленных запросов (GeoServer sprites, capabilities и т.д.)
    proxy_cache_path C:/nginx/cache/geoserver levels=1:2 keys_zone=geoserver_cache:10m max_size=200m inactive=24h;

    # Gzip — сжатие текстовых ответов (включая MVT тайлы)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.mapbox-vector-tile
        image/svg+xml;

    server {
        listen 443 ssl;
        http2 on;
        server_name itwin.kz *.itwin.kz;

        ssl_certificate      C:/nginx/certs/itwin.kz-chain.pem;
        ssl_certificate_key  C:/nginx/certs/itwin.kz-key.pem;

        # SSL оптимизация — session resumption (экономия ~100ms на повторных соединениях)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets on;

        # Современные протоколы и быстрые шифры
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        client_max_body_size 20M;

        # ===========================================================
        # api-aliya
        # ===========================================================
        location = /api-aliya {
            return 301 $scheme://$request_uri/;
        }

        location /api-aliya/ {
            client_max_body_size 50M;
            proxy_pass http://127.0.0.1:8010/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # ===========================================================
        # api-sirius
        # ===========================================================
        location /api-sirius/ {
            client_max_body_size 50M;
            proxy_pass http://localhost:8009/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # ===========================================================
        # map-api (FastAPI для карты)
        # ===========================================================
        location /map-api/ {
            client_max_body_size 20M;
            proxy_pass http://localhost:8011/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # ===========================================================
        # Главная (порт 3006)
        # ===========================================================
        location / {
            proxy_pass http://localhost:3006/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # ===========================================================
        # kmu (порт 3000)
        # ===========================================================
        location /kmu {
            proxy_pass http://localhost:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # ===========================================================
        # ITwin Map — Nuxt 3 SSR (порт 3007)
        # 502 Bad Gateway: проверьте процесс на 3007, error.log (upstream connect/refused),
        # после деплоя — что HTML и _nuxt/* из одной сборки (иначе 404 на чанках).
        # ===========================================================
        location /itwin-map/ {
            proxy_pass http://itwin_map_nuxt;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_http_version 1.1;
            # keepalive к Node (upstream itwin_map_nuxt); без пустого Connection nginx шлёт close и рвёт пул
            proxy_set_header Connection "";

            proxy_connect_timeout 15s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Буферизация SSR-ответов
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }

        # Nuxt _nuxt/ ассеты — immutable кеш (хеши в именах файлов)
        location ~* ^/itwin-map/_nuxt/.+\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico|wasm)$ {
            proxy_pass http://itwin_map_nuxt;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            expires 365d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
        }

        # Прочая статика itwin-map (favicon, иконки из public/)
        location ~* ^/itwin-map/.+\.(png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
            proxy_pass http://itwin_map_nuxt;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ===========================================================
        # map (порт 3003)
        # ===========================================================
        location /map/ {
            proxy_pass http://localhost:3003;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # ===========================================================
        # gift (порт 3004)
        # ===========================================================
        location /gift/ {
            proxy_pass http://localhost:3004/gift/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # ===========================================================
        # GeoServer (WMS / WFS / WMTS)
        # ===========================================================
        location /geoserver/ {
            proxy_pass http://localhost:8085/geoserver/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Исправление редиректов (http и https)
            proxy_redirect http://localhost:8085/geoserver/ /geoserver/;
            proxy_redirect https://localhost:8085/geoserver/ /geoserver/;

            # HTTP 1.1 keep-alive к бэкенду — меньше TCP-хендшейков
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Таймауты для тяжёлых WMS/WFS запросов
            proxy_connect_timeout 300;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
            send_timeout 600;

            # Буферы — увеличены для GetMap / GetCapabilities
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;
            proxy_temp_file_write_size 512k;

            client_max_body_size 100M;
        }

        # GeoServer sprites/www — nginx proxy cache (sprite.json грузится 12+ сек!)
        location ~* ^/geoserver/www/ {
            proxy_pass http://localhost:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache geoserver_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            add_header X-Cache-Status $upstream_cache_status;

            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # GeoServer GWC кешированные тайлы
        location ~* ^/geoserver/gwc/ {
            proxy_pass http://localhost:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache geoserver_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;

            expires 1h;
            add_header Cache-Control "public";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ===========================================================
        # autism (порт 3002)
        # ===========================================================
        location /autism {
            proxy_pass http://localhost:3002;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # ===========================================================
        # api-rating
        # ===========================================================
        location /api-rating/ {
            client_max_body_size 20M;
            proxy_pass http://localhost:8006/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===========================================================
        # bot
        # ===========================================================
        location /bot/ {
            client_max_body_size 20M;
            proxy_pass http://localhost:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===========================================================
        # ai-api
        # ===========================================================
        location /ai-api/ {
            client_max_body_size 1000M;
            proxy_pass http://localhost:8003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 300s;
        }

        # ===========================================================
        # english-cinema
        # ===========================================================
        location /english-cinema/ {
            client_max_body_size 1000M;
            proxy_pass http://localhost:8008/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 300s;
        }

        # ===========================================================
        # english (порт 3005)
        # ===========================================================
        location /english/ {
            proxy_pass http://localhost:3005/english/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # ===========================================================
        # english-words
        # ===========================================================
        location /english-words/ {
            client_max_body_size 1000M;
            proxy_pass http://localhost:8007/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 300s;
        }

        # ===========================================================
        # api-bot
        # ===========================================================
        location /api-bot/ {
            client_max_body_size 20M;
            proxy_pass http://localhost:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_cache_bypass $http_upgrade;
        }

        # ===========================================================
        # FastAPI — /api/
        # ===========================================================
        location /api/ {
            client_max_body_size 20M;
            proxy_pass http://localhost:8002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===========================================================
        # RASA
        # ===========================================================
        location /rasa/ {
            proxy_pass http://localhost:5005/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===========================================================
        # game (статические файлы)
        # ===========================================================
        location /game {
            alias H:/projects/game/;
            index aliya_platformer.html;
            try_files $uri $uri/ aliya_platformer.html;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ===========================================================
        # tgid-gis (Flask — порт 5000)
        # ===========================================================
        location /tgid-gis/ {
            client_max_body_size 100M;
            proxy_pass http://localhost:5000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            proxy_set_header X-Script-Name /tgid-gis;
            proxy_set_header X-Forwarded-Prefix /tgid-gis;

            rewrite ^/tgid-gis/?(.*) /$1 break;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # Перенаправление HTTP → HTTPS
    server {
        listen 80;
        server_name itwin.kz *.itwin.kz;
        return 301 https://$host$request_uri;
    }
}
